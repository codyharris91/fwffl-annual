[project]
name = "fwffl-annual"
version = "0.1.0"
description = "Six seasons of the FWFFL Sleeper league, rebuilt into a single-page record book"
readme = "README.md"
authors = [
    { name = "Cody Harris", email = "31891287+codyharris91@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pandas>=3.0.5",
]

[project.scripts]
fwffl-annual = "fwffl_annual.__main__:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
